<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AizerChat You</title>

<link rel="stylesheet" href="/AizerChat-V3/style.css">
<link rel="stylesheet" href="/AizerChat-V3/profile.css">

</head>


<body>


<div class="app">


<header class="app-header glass">

    <div class="header-left profile-title">

        <button class="iconBtn" onclick="history.back()">
            ←
        </button>

        <h1>You</h1>

    </div>

    <div class="header-right">

        <button class="icon-btn">
            ⚙
        </button>

    </div>

</header>


<div class="profilePage">


<div class="profileHeader">


<div class="profileImageBox">

<img src="images/profile.jpg">

<button class="editPhoto">
+
</button>

</div>



<h2>Sablaizer</h2>

<p>
AizerChat user
</p>


</div>





<div class="profileMenu">



<div class="settingsCard">

<div class="settingsIcon">
👤
</div>

<div>

<h3>Account</h3>

<p>Manage your profile</p>

</div>

</div>





<div class="settingsCard">

<div class="settingsIcon">
🔵
</div>
<div class="settingsIcon">
🟢
</div>

<div>

<h3>Data/Text Mode</h3>

<p>Blue for internet data: Green for sms messages</p>

</div>


</div>





<div class="settingsCard">

<div class="settingsIcon">
👋
</div>

<div>

<h3>Help and feedback</h3>

<p>Send feedback to help resolve tech issues</p>

</div>


</div>





<div class="settingsCard">

<div class="settingsIcon">
🔒
</div>

<div>

<h3>Privacy</h3>

<p>Control your security</p>

</div>


</div>



</div>

<div class="settingsCard logoutCard" id="logoutBtn">

    <div class="settingsIcon">
        🚪
    </div>

    <div>
        <h3>Log out</h3>
        <p>Sign out of your AizerChat account</p>
    </div>

</div>
<script src="/AizerChat-V3/app.js"></script>
<script src="/AizerChat-V3/profile.js"></script>
<script src="/AizerChat-V3/theme.js"></script>

</body>

</html>
