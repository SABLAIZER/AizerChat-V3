<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AizerChat Login</title>

<link rel="stylesheet" href="/AizerChat-V3/style.css">
<link rel="stylesheet" href="/AizerChat-V3/login.css">

</head>

<body>

<div class="app">

    <main class="loginPage">

        <!-- LOGO -->

        <div class="loginLogo">

            <div class="logoCircle">
                💬
            </div>

            <h1>AizerChat</h1>

            <p>Connect. Chat. Share.</p>

        </div>


        <!-- LOGIN CARD -->

        <div class="loginCard">

            <h2>Welcome back 👋</h2>

            <p class="loginSubtitle">
                Login to continue to AizerChat
            </p>


            <!-- EMAIL -->

            <div class="inputGroup">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="inputGroup">

                <label for="password">
                    Password
                </label>

                <div class="passwordBox">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        id="showPassword">
                        👁
                    </button>

                </div>

            </div>


            <!-- FORGOT PASSWORD -->

            <button
                class="forgotBtn"
                type="button">

                Forgot password?

            </button>


            <!-- LOGIN -->

            <button
                class="loginBtn"
                id="loginBtn"
                type="button">

                Login

            </button>


            <div class="divider">

                <span>or</span>

            </div>


            <!-- SIGN UP -->

            <p class="signupText">

                Don't have an account?

                <button
                    type="button"
                    id="signupBtn">

                    Create account

                </button>

            </p>

        </div>


        <p class="loginFooter">
            AizerChat © 2026
        </p>

    </main>

</div>


<script src="/AizerChat-V3/login.js"></script>

</body>

</html>
