<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AizerChat Chat</title>

<link rel="stylesheet" href="/AizerChat-V3/style.css">
<link rel="stylesheet" href="/AizerChat-V3/chat.css">

</head>


<body>

<div class="app">

    <div class="chatPage">


        <!-- =========================
             CHAT HEADER
        ========================== -->

 <!-- =========================
     CHAT HEADER
========================= -->

<header class="chatHeader">

    <button
        id="backBtn"
        class="chatBackBtn"
        type="button">
        ←
    </button>


    <!-- CONTACT PROFILE -->
    <button
        id="contactProfileBtn"
        class="contactProfileBtn"
        type="button">

        <img
            id="contactAvatar"
            src="images/profile.jpg"
            alt="Contact">

        <div class="contactInfo">

            <h3 id="contactName">
                Friend Name
            </h3>

            <small id="contactStatus">
                Online
            </small>

        </div>

    </button>


    <!-- CHAT ACTIONS -->

    <div class="chatActions">

        <button
            id="chatSearchBtn"
            type="button"
            title="Search">
            🔎
        </button>

        <button
            id="callBtn"
            type="button"
            title="Call">
            ☎
        </button>

    </div>

</header>


<!-- =========================
     CHAT INFO / PROFILE PAGE
========================= -->

<section
    id="chatInfoPage"
    class="chatInfoPage">

    <div class="chatInfoHeader">

        <button
            id="closeChatInfo"
            type="button">
            ←
        </button>

        <h2>Chat Info</h2>

    </div>


    <!-- PROFILE -->

    <div class="chatInfoProfile">

        <img
            id="infoContactAvatar"
            src="images/profile.jpg"
            alt="Contact">

        <h2 id="infoContactName">
            Friend Name
        </h2>

        <p id="infoContactStatus">
            Online
        </p>

    </div>


    <!-- MEDIA -->

    <button
        id="infoMedia"
        class="chatInfoItem"
        type="button">

        <span class="chatInfoIcon">🖼️</span>

        <span>
            <strong>Media, Links & Docs</strong>
            <small>Photos, videos, files and links</small>
        </span>

        <b>›</b>

    </button>


    <!-- NOTIFICATIONS -->

    <button
        id="infoNotifications"
        class="chatInfoItem"
        type="button">

        <span class="chatInfoIcon">🔔</span>

        <span>
            <strong>Notifications</strong>
            <small>Chat notification settings</small>
        </span>

        <b>›</b>

    </button>


    <!-- WALLPAPER -->

    <button
        id="infoWallpaper"
        class="chatInfoItem"
        type="button">

        <span class="chatInfoIcon">🎨</span>

        <span>
            <strong>Chat Wallpaper</strong>
            <small>Change the background</small>
        </span>

        <b>›</b>

    </button>


    <!-- CHAT SETTINGS -->

    <button
        id="infoSettings"
        class="chatInfoItem"
        type="button">

        <span class="chatInfoIcon">⚙️</span>

        <span>
            <strong>Chat Settings</strong>
            <small>Manage this conversation</small>
        </span>

        <b>›</b>

    </button>


    <!-- CHAT LOG -->

    <button
        id="infoChatLog"
        class="chatInfoItem"
        type="button">

        <span class="chatInfoIcon">💬</span>

        <span>
            <strong>Chat Log</strong>
            <small>View conversation history</small>
        </span>

        <b>›</b>

    </button>


    <!-- STARRED -->

    <button
        id="infoStarred"
        class="chatInfoItem"
        type="button">

        <span class="chatInfoIcon">⭐</span>

        <span>
            <strong>Starred Messages</strong>
            <small>Messages you've saved</small>
        </span>

        <b>›</b>

    </button>

</section>
<!-- =========================
     CHAT MORE MENU
========================= -->

<div id="chatMoreMenu" class="chatMoreMenu">

    <button id="menuSearch">
        🔎
        <span>Search</span>
    </button>

    <button id="menuMedia">
        🖼️
        <span>Media, links & docs</span>
    </button>

    <button id="menuStarred">
        ⭐
        <span>Starred messages</span>
    </button>

    <button id="menuNotifications">
        🔔
        <span>Notifications</span>
    </button>

    <button id="menuWallpaper">
        🎨
        <span>Chat wallpaper</span>
    </button>

    <button id="menuSettings">
        ⚙️
        <span>Chat settings</span>
    </button>

</div>

<div id="chatSearchBar" class="chatSearchBar">

    <button id="closeChatSearch">✕</button>

    <input
        id="chatSearchInput"
        type="text"
        placeholder="Search messages..."
        autocomplete="off"
    >

    <span id="chatSearchCount">0/0</span>

    <button id="chatSearchPrev">↑</button>

    <button id="chatSearchNext">↓</button>

</div>

        <!-- =========================
             MESSAGES
        ========================== -->

        <main id="messages">

        </main>


        <!-- =========================
             TYPING INDICATOR
        ========================== -->

        <div
            id="typingIndicator"
            class="typingIndicator">

            <span></span>
            <span></span>
            <span></span>

            <label id="typingText">
                Typing...
            </label>

        </div>


        <!-- =========================
             ATTACHMENT MENU
        ========================== -->

        <div
            id="attachMenu"
            class="attachMenu">

            <button id="galleryBtn">
                🖼️ Gallery
            </button>

            <button id="fileBtn">
                📄 File
            </button>

        </div>


        <!-- IMAGE PICKER -->

        <input
            type="file"
            id="galleryInput"
            accept="image/*"
            hidden>


        <!-- FILE PICKER -->

        <input
            type="file"
            id="fileInput"
            hidden>


        <!-- CAMERA -->

        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            hidden>

<!-- =========================================
     REPLY PREVIEW
========================================= -->
<div
    id="replyPreview"
    class="replyPreview">
    <div class="replyPreviewBar"></div>
    <div class="replyPreviewContent">
        <div
            id="replyPreviewTitle"
            class="replyPreviewTitle">
            Replying
        </div>
        <div
            id="replyPreviewText"
            class="replyPreviewText">
        </div>
    </div>
    <button
        id="replyPreviewClose"
        class="replyPreviewClose">
        ✕
    </button>
</div>

        <!-- =========================
             MESSAGE BAR
        ========================== -->

        <div class="messageBar">


            <button
                id="attachBtn"
                class="chatToolBtn"
                aria-label="Attachments">

                📎

            </button>


            <button
                id="cameraBtn"
                class="chatToolBtn"
                aria-label="Camera">

                📷

            </button>


            <textarea
                id="messageInput"
                placeholder="Message..."
                rows="1"></textarea>
                
                
                <div id="voiceRecording" class="voiceRecording">

    <span class="voiceRecordingDot"></span>

    <span
        id="voiceRecordingTime"
        class="voiceRecordingTime">
        0:00
    </span>

    <span class="voiceRecordingText">
        Recording voice message...
    </span>

    <button
        id="voiceCancelBtn"
        class="voiceCancelBtn"
        type="button">
        ✕
    </button>

</div>

<button
    id="sendBtn"
    type="button"
    aria-label="Voice message">

    🎙️

</button>

        </div>


    </div>

</div>

<!-- =========================================
     ATTACHMENT PREVIEW
========================================= -->

<div id="attachmentPreview" class="attachmentPreview">

    <div class="attachmentPreviewBox">

        <button
            id="closeAttachmentPreview"
            class="previewClose">
            ✕
        </button>

        <div
            id="attachmentPreviewContent"
            class="attachmentPreviewContent">
        </div>

        <div class="previewInfo">

            <div id="attachmentFileName">
            </div>

            <div id="attachmentFileSize">
            </div>

        </div>

        <label class="viewOnceOption">

            <input
                type="checkbox"
                id="viewOnceCheck">

            <span>👁 View once</span>

        </label>

        <div class="previewActions">

            <button
                id="cancelAttachment"
                class="previewCancel">
                Cancel
            </button>

            <button
                id="sendAttachment"
                class="previewSend">
                ➤ Send
            </button>

        </div>

    </div>

</div>

<!-- Keep these -->
<script src="/AizerChat-V3/app.js"></script>
<script src="/AizerChat-V3/chat.js"></script>

<!-- Add this -->
<script type="module" src="/AizerChat-V3/firebase-sync.js"></script>
</body>

</html>
