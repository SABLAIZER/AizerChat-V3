<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Add Friend</title>

<link rel="stylesheet" href="/AizerChat-V3/style.css">
<link rel="stylesheet" href="/AizerChat-V3/addfriend.css">

</head>


<body>

<div class="app addFriendPage">


    <!-- ==========================
         HEADER
    =========================== -->

    <header class="pageHeader">

        <button
            class="iconBtn"
            onclick="history.back()">

            ←

        </button>


        <h2 class="pageTitle">
            Add Friend
        </h2>


        <!-- Keeps title centered -->

        <div style="width:42px;"></div>

    </header>



    <!-- ==========================
         ADD FRIEND CONTENT
    =========================== -->

    <main class="addFriendContent">


        <div class="friendIcon">

            👤

        </div>


        <h3>
            Add a new connection
        </h3>


        <p>
            Add friends using their name and email address.
        </p>



        <!-- NAME -->

        <div class="inputGroup">

            <label for="friendName">
                Name
            </label>

            <input
                type="text"
                id="friendName"
                placeholder="Friend name"
                autocomplete="name">

        </div>



        <!-- EMAIL -->

        <div class="inputGroup">

            <label for="friendEmail">
                Email address
            </label>

            <input
                type="email"
                id="friendEmail"
                placeholder="friend@example.com"
                autocomplete="email">

        </div>



        <!-- ADD BUTTON -->

        <button
            class="primaryBtn"
            id="addFriendBtn">

            Add Friend

        </button>


    </main>


</div>



<!-- ==========================
     JAVASCRIPT
=========================== -->

<script src="js/addfriend.js"></script>

<script src="js/theme.js"></script>
<script src="js/app.js"></script>

</body>

</html>
