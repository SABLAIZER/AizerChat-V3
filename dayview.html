<!DOCTYPE html>
<html lang="en">

<head>

<title>DayView</title>

<link rel="stylesheet" href="/AizerChat-V3/style.css">

</head>

<body>

<div class="app">

<div class="dayView">

<div class="progressBar">

<div id="progress"></div>

</div>

<header class="dayHeader">

<button id="closeDay">✕

</button>

<div class="dayUser">

<img id="dayAvatar">

<div>

<h3 id="dayName"></h3>

<small id="dayTime"></small>

</div>

</div>

</header>

<div class="dayContent">

<img id="dayImage">

<p id="dayText"></p>

</div>

<div class="dayBottom">

<input
type="text"
placeholder="Reply...">

<button>

➤

</button>

</div>

</div>

</div>
